<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>__TITLE__</title>
<style>
:root {
  color-scheme: dark light;
  --bg: #10161d;
  --surface: #17212b;
  --surface-2: #1d2935;
  --text: #e5edf4;
  --muted: #a8bac9;
  --line: #314253;
  --accent: #78d6c6;
  --accent-2: #f0b86e;
  --danger: #ef8b8b;
  --good: #8fd694;
  --radius: 8px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f7f9fb;
    --surface: #ffffff;
    --surface-2: #eef3f7;
    --text: #18222c;
    --muted: #526575;
    --line: #cfdae4;
    --accent: #147f73;
    --accent-2: #9a5b00;
    --danger: #a22b2b;
    --good: #286b32;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0 auto;
  padding: 24px 22px 80px;
  max-width: 1500px;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
h1 { font-size: 30px; line-height: 1.15; margin: 0 0 6px; }
h2 { font-size: 21px; margin: 34px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
h3 { font-size: 15px; margin: 18px 0 6px; color: var(--accent); }
a { color: var(--accent); }
p { margin: 6px 0; }
.subtitle { color: var(--muted); max-width: 1100px; }
.description { color: var(--muted); max-width: 1200px; }
.note { color: var(--muted); font-size: 12.5px; max-width: 1300px; }
.toc, .filters {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin: 12px 0;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.toc a { text-decoration: none; font-size: 13px; }
.toc a:hover { text-decoration: underline; }
.filter-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.filter-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.filters a { text-decoration: none; padding: 2px 7px; border-radius: 999px; border: 1px solid transparent; }
.filters a:hover { border-color: var(--line); }
.filters a.active { background: var(--surface-2); border-color: var(--accent); color: var(--accent); }
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin: 12px 0 16px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 12px;
}
.card-label { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
.card-value { font-size: 22px; font-weight: 650; margin: 3px 0; }
.card-detail { color: var(--muted); font-size: 12px; }
.table-block { margin: 10px 0 20px; }
.table-block caption {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.scroll {
  overflow: auto;
  max-height: 640px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--surface-2);
  color: var(--text);
  font-weight: 650;
  white-space: nowrap;
}
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
tbody tr:nth-child(even) { background: rgba(127, 147, 166, .06); }
tbody tr:hover { background: rgba(120, 214, 198, .09); }
tbody tr:last-child td { border-bottom: 0; }
.status-good { color: var(--good); }
.status-bad { color: var(--danger); }
footer { margin-top: 36px; color: var(--muted); font-size: 12px; }
@media (max-width: 700px) {
  body { padding: 14px 10px 60px; }
  h1 { font-size: 24px; }
  .scroll { max-height: none; }
}
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <p class="subtitle">__SUBTITLE__</p>
  __NAV__
  __TOC__
</header>
<main>
__BODY__
</main>
<footer>__FOOTER__</footer>
</body>
</html>
