# Deny configuration for cargo-deny
# See https://github.com/EmbarkStudios/cargo-deny/blob/main/docs/

# Licenses are a file-level gate: `just check-deps` and the CI `Licenses` job
# fail on any crate whose effective license is not listed here, so a new
# transitive dependency that changes the license surface is caught before it
# lands rather than after a release ships it.
[licenses]
version = 2
# Every entry is a deliberate admission. Non-obvious ones carry a note naming
# what forces them and what obligation they impose.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "CC0-1.0",
    # MIT No Attribution: permissive, public-domain-equivalent. Reached through
    # jsonschema -> referencing -> fluent-uri -> borrow-or-share.
    "MIT-0",
    # zlib License: permissive OSI license. Reached through hashbrown -> foldhash.
    "Zlib",
    # Unicode License v3: permissive OSI license covering the Unicode data and
    # ICU crates behind url -> idna, plus unicode-ident.
    "Unicode-3.0",
    # MPL-2.0 is file-level copyleft: the obligation attaches to modified files
    # of the covered crate, which Cake does not modify. Reached through
    # dirs -> dirs-sys -> option-ext.
    "MPL-2.0",
    # Community Data License Agreement Permissive 2.0: data terms for the WebPKI
    # root certificate list. Reached through webpki-root-certs.
    "CDLA-Permissive-2.0",
]

[bans]
deny = [
    { name = "rust-serialization", version = "<=0.4.4" },
]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # Add advisory IDs to ignore here
    # Example: "RUSTSEC-0000-0000"
]
