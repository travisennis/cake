# Deny configuration for cargo-deny
# See https://github.com/EmbarkStudios/cargo-deny/blob/main/docs/

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "CC0-1.0",
]

[bans]
deny = [
    { name = "rust-serialization", version = "<=0.4.4" },
]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # unsafe-libyaml 0.2.11 is unmaintained and has no patched release. It is
    # reached only through the deprecated serde_yaml, which Cake uses solely for
    # local SKILL.md frontmatter (src/config/skills.rs). Retire serde_yaml in
    # Task 123, then remove this ignore.
    "RUSTSEC-2024-0449",
]
