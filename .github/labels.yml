# Label governance for Cake (travisennis/cake).
#
# This file is the single source of truth for repository labels. Keep it
# sorted by name. Change the vocabulary here first, then sync:
#
#   python3 scripts/sync-labels.py             # create/update labels to match this file
#   python3 scripts/sync-labels.py --check     # verify the repo matches (exit 1 on drift)
#   python3 scripts/sync-labels.py --prune     # also delete labels not listed here
#   python3 scripts/sync-labels.py --check-file  # validate this file only (no network)
#
# The label-governance workflow applies the file after merges to `master`,
# removes out-of-vocabulary labels from issues at runtime, and exposes a
# manual "prune" dispatch. Labels not listed here are out of vocabulary.
#
# Notes:
# - The `type:`, `area:`, and `risk:` vocabulary maps to the former ahm task
#   labels. Priority, effort, and status are Projects v2 fields, not labels.
# - `dependencies`, `github_actions`, and `rust` are applied automatically by
#   Dependabot and must not be removed.
# - `bug` and `enhancement` (GitHub defaults) and the repo's `documentation`
#   label were retired in favor of `type:bug`, `type:docs`, and `type:feature`.

