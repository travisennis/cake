# Primary CI workflow.
#
# macOS is the primary development and validation platform for cake. Linux is
# currently an aspirational compatibility target, so CI keeps Linux at compile
# level and runs the remaining checks on macOS.

name: CI

on:
  push:
    branches: [master, main]
  # Deliberately unfiltered by base branch. A stacked pull request targets the
  # branch below it rather than master, and a `branches:` filter here would give
  # it no checks at all -- silently, since GitHub reports an unrun workflow as
  # absent rather than failed. Pushes stay filtered: an open pull request
  # already covers its own branch.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-check:
    name: Linux Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  fmt:
    name: Format
    needs: linux-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy (all-features)
    needs: linux-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --message-format=short -- -D warnings

  # License surface of the dependency graph. Reads Cargo.lock and the allowlist
  # in deny.toml, so it needs no build and finishes in under a minute; a new
  # transitive crate with an unlisted license fails here instead of shipping.
  licenses:
    name: Licenses
    needs: linux-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check licenses

  complexity:
    name: Complexity
    needs: linux-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-crap@0.2.2
      - run: scripts/check-cc.sh

  docs:
    name: Docs
    needs: linux-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check domain glossary anchors
        run: python3 scripts/lint-domain-glossary.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: panache@3.0.0
      - run: panache format --check . --quiet
      - run: panache lint . --quiet
      - name: Check rustdoc
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  build:
    name: Build
    needs: linux-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
