# Primary CI workflow.
#
# macOS is the primary development and validation platform for cake. Linux is
# currently an aspirational compatibility target, so CI keeps Linux at compile
# level plus the Landlock sandbox tests (`Linux Test`) and runs the full
# correctness checks on macOS.

name: CI

on:
  push:
    branches: [master, main]
  # Deliberately unfiltered by base branch. A stacked pull request targets the
  # branch below it rather than master, and a `branches:` filter here would give
  # it no checks at all -- silently, since GitHub reports an unrun workflow as
  # absent rather than failed. Pushes stay filtered: an open pull request
  # already covers its own branch.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  COVERAGE_THRESHOLD: 90

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.filter.outputs.coverage }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Shared with the local pre-push gate; see scripts/classify-changes.sh.
          CLASS="$(scripts/classify-changes.sh --base "$BASE" --head "$HEAD")"
          if [ "$CLASS" != "docs" ] && [ "$CLASS" != "none" ]; then
            echo "coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "coverage=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Classifier fixture tests
        shell: bash
        run: scripts/test-classify-changes.sh

  linux-check:
    name: Linux Check
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  # Executes the Landlock enforcement path's tests, which are `#[cfg(test)]`
  # unit tests and do not require the runner kernel to support a specific
  # Landlock ABI. Scoped to the sandbox module: the rest of the suite already
  # runs on macOS, and the known timing-flaky unix process tests belong in a
  # broader Linux coverage effort, not a required security gate.
  linux-test:
    name: Linux Test
    needs: linux-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --quiet clients::tools::sandbox

  fmt:
    name: Format
    needs: linux-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy (${{ matrix.features.name }})
    needs: linux-check
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: all-features
            args: --all-features
          - name: no-default-features
            args: --no-default-features
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets ${{ matrix.features.args }} --message-format=short -- -D warnings

  test:
    name: Test
    needs: linux-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --quiet

  docs:
    name: Docs
    needs: linux-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cap always-loaded instructions and report the corpus
        run: python3 scripts/lint-instruction-size.py
      - name: Check domain glossary anchors
        run: python3 scripts/lint-domain-glossary.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: panache@3.0.0
      - run: panache format --check . --quiet
      - run: panache lint . --quiet

  coverage:
    name: Coverage
    needs: [changes, linux-check]
    if: github.event_name == 'push' || needs.changes.outputs.coverage == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo install cargo-crap --version 0.2.2 --locked

      - name: Check coverage and change-risk regression
        run: scripts/check-coverage.sh --cargo-crap-format github

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
