name: move-closed-issues-to-done

# Moves the Cake Backlog project Status field to Done for every issue a merged
# pull request closes via a `Closes #N`-style keyword in its body.
#
# GitHub closes the linked issue automatically on merge; this workflow keeps the
# board's Status field in sync, which nothing else updates.
#
# Requires a classic PAT with `repo` + `project` scopes stored as the
# CAKE_BACKLOG_PAT repository secret. GITHUB_TOKEN is scoped to the repository
# and cannot access Projects v2, and a fine-grained PAT cannot reach a
# user-owned project board.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  move-to-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CAKE_BACKLOG_PAT }}
    steps:
      - name: Collect issues closed by this PR
        id: closed
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Match GitHub's exact closing keywords, preceded by a line start or
          # a character that is neither alphanumeric nor underscore, followed
          # by whitespace and a
          # comma-separated reference list (GitHub's documented multi-ref
          # form). Prose like "(see #115)" is never collected, and keyword
          # lookalikes ("prefixes #1", "closing #5", "fixes: #5") do not
          # match because GitHub would not close them. The boundary is POSIX
          # ERE only (GNU grep rejects [[:<:]] with "Invalid character class
          # name"). The `|| true` sits inside the substitution so a PR with no
          # closing keyword stays green under pipefail without polluting the
          # issues value.
          ISSUES="$(printf '%s' "$BODY" | grep -oiE '(^|[^[:alnum:]_])(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]]+(#[0-9]+([[:space:]]*,[[:space:]]*#[0-9]+)*)' | grep -oE '#[0-9]+' | tr -d '#' | sort -u | tr '\n' ' ' || true)"
          echo "issues=${ISSUES}" >> "$GITHUB_OUTPUT"

      - name: Move each closed issue to Done
        env:
          ISSUES: ${{ steps.closed.outputs.issues }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "CAKE_BACKLOG_PAT is not available for this event (fork PR?); skipping."
            exit 0
          fi
          if [ -z "${ISSUES}" ]; then
            echo "No issues referenced in the PR body; nothing to move."
            exit 0
          fi
          # Cake Backlog board (project 1) node IDs, resolved via
          # `gh project field-list 1 --owner @me`. The moves go through
          # `gh api graphql` rather than `gh project item-edit` because the
          # runner's gh (2.96) predates the by-name --owner/--url form; gh api
          # is version-stable.
          PROJECT_ID="PVT_kwHNFebOAX0lXg"
          STATUS_FIELD_ID="PVTSSF_lAHNFebOAX0lXs4WZke6"
          DONE_OPTION_ID="245762e9"

          # Fail loudly if the board id is stale or the PAT cannot see it
          # (a fine-grained PAT cannot reach a user-owned board).
          if ! gh api graphql -f query='query($pid: ID!) { node(id: $pid) { ... on ProjectV2 { id } } }' -f pid="${PROJECT_ID}" --jq '.data.node.id' >/dev/null 2>&1; then
            echo "error: board ${PROJECT_ID} not found or not visible to CAKE_BACKLOG_PAT; re-resolve the node IDs with \`gh project field-list 1 --owner @me\`" >&2
            exit 1
          fi

          # Fetch the whole board via node(id:) — gh's `project item-list`
          # queries the project owner's organization, which needs the read:org
          # scope the PAT does not have. The node query touches only the
          # project and issue numbers, so it works with `project` scope alone.
          # Projects v2 caps each page at 100 items; loop over the cursor.
          board=""
          cursor="null"
          while :; do
            page="$(gh api graphql -f query='query($pid: ID!, $cursor: String) { node(id: $pid) { ... on ProjectV2 { items(first: 100, after: $cursor) { pageInfo { hasNextPage endCursor } nodes { id content { ... on Issue { number } } } } } } }' -f pid="${PROJECT_ID}" -F cursor="${cursor}" --jq '.data.node.items')"
            board="${board}$(printf '%s' "${page}" | jq -r '.nodes[] | select(.content != null) | "\(.content.number) \(.id)"')"$'\n'
            if [ "$(printf '%s' "${page}" | jq -r '.pageInfo.hasNextPage')" = "true" ]; then
              cursor="\"$(printf '%s' "${page}" | jq -r '.pageInfo.endCursor')\""
            else
              break
            fi
          done

          for n in ${ISSUES}; do
            item_id="$(printf '%s' "${board}" | awk -v n="${n}" '$1==n {print $2; exit}')"
            if [ -z "${item_id}" ]; then
              echo "warning: #${n} is not on the Cake Backlog board (see #115)"
              continue
            fi
            if out="$(gh api graphql -f query='mutation($pid: ID!, $iid: ID!, $fid: ID!, $oid: String!) { updateProjectV2ItemFieldValue(input: {projectId: $pid, itemId: $iid, fieldId: $fid, value: {singleSelectOptionId: $oid}}) { projectV2Item { id } } }' -f pid="${PROJECT_ID}" -f iid="${item_id}" -f fid="${STATUS_FIELD_ID}" -f oid="${DONE_OPTION_ID}" --jq '.data.updateProjectV2ItemFieldValue.projectV2Item.id' 2>&1 >/dev/null)"; then
              echo "moved #${n} to Done"
            else
              echo "warning: #${n} not moved: ${out}"
            fi
          done
