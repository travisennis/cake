name: PR Title

# GitHub uses the PR title as the default squash-commit subject when a PR has
# multiple commits. Recheck edits so an old passing result cannot survive a
# title change.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"]
          pattern = r"(?:feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\([a-z][a-z0-9-]*\))?!?: \S.*"
          if not re.fullmatch(pattern, title):
              print(
                  f"PR title must be a Conventional Commit subject, e.g. "
                  f"'feat(session): show timing breakdown'; got {title!r}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
